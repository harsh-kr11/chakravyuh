[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chakravyuh"
version = "0.1.0"
description = "Incident-time cross-sector attack-path interdiction for critical national infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The CHAKRAVYUH contributors" }]
keywords = [
    "cybersecurity", "critical-infrastructure", "attack-graph",
    "interdiction", "multi-agent", "SOAR", "MITRE-ATTACK", "NCIIPC", "CERT-In",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "networkx>=3.1",
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
detect = ["scikit-learn>=1.3", "scipy>=1.10"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
llm = ["anthropic>=0.34"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "httpx>=0.27"]
all = ["chakravyuh[detect,api,llm,dev]"]

[project.scripts]
chakravyuh = "chakravyuh.cli:main"
chakravyuh-demo = "chakravyuh.demo:main"

[project.urls]
Homepage = "https://github.com/your-org/chakravyuh"
Documentation = "https://github.com/your-org/chakravyuh/tree/main/docs"
Issues = "https://github.com/your-org/chakravyuh/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chakravyuh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["chakravyuh"]
